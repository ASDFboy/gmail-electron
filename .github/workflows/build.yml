name: Build Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run package:win

      - name: Zip the packaged app
        run: Compress-Archive -Path "dist/Gmail Desktop-win32-x64" -DestinationPath "Gmail-Desktop-win32-x64.zip"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: Gmail-Desktop-win32-x64
          path: Gmail-Desktop-win32-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Gmail-Desktop-win32-x64.zip
